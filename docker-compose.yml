services:
  postgres:
    image: postgres:16-alpine
    container_name: flowgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowgate_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-flowgate_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flowgate} -d ${POSTGRES_DB:-flowgate_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flowgate-network

  redis:
    image: redis:7-alpine
    container_name: flowgate-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flowgate_redis_pass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-flowgate_redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - flowgate-network

  api-preview:
    profiles: ['preview']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowgate-api-preview
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowgate}:${POSTGRES_PASSWORD:-flowgate_dev_password}@postgres:5432/${POSTGRES_DB:-flowgate_dev}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-flowgate_redis_pass}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-flowgate_dev_jwt_secret_change_in_production_min32chars}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowgate-network

  web-preview:
    profiles: ['preview']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowgate-web-preview
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api-preview
    networks:
      - flowgate-network

volumes:
  postgres_data:
    name: flowgate_postgres_data
  redis_data:
    name: flowgate_redis_data

networks:
  flowgate-network:
    name: flowgate_network
    driver: bridge
