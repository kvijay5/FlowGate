name: FlowGate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Shared Packages
        run: pnpm build:shared

      - name: Check code formatting
        run: pnpm format:check

      - name: Type check all workspaces
        run: pnpm check-types

      - name: Lint all workspaces
        run: pnpm lint

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowgate
          POSTGRES_PASSWORD: flowgate_dev_password
          POSTGRES_DB: flowgate_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Shared Packages
        run: pnpm build:shared

      - name: Deploy Prisma Migrations
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://flowgate:flowgate_dev_password@localhost:5432/flowgate_dev?schema=public

      - name: Run Database Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://flowgate:flowgate_dev_password@localhost:5432/flowgate_dev?schema=public

      - name: Run Unit Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://flowgate:flowgate_dev_password@localhost:5432/flowgate_dev?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-minimum-32-chars-long-12345
          JWT_EXPIRES_IN: 1d
          NOTIFICATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEBHOOK_HMAC_SECRET: test-webhook-hmac-secret-key-32-chars
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Run E2E & Integration Tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://flowgate:flowgate_dev_password@localhost:5432/flowgate_dev?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-minimum-32-chars-long-12345
          JWT_EXPIRES_IN: 1d
          NOTIFICATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEBHOOK_HMAC_SECRET: test-webhook-hmac-secret-key-32-chars
          ALLOW_LOOPBACK_WEBHOOK_FOR_TESTS: 'true'
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build Shared Packages & Applications
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Validate Docker Compose Configuration
        run: docker compose config
